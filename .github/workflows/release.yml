name: Build and Release MissionStrike

on:
  push:
    tags:
      - 'v*' # Trigger on tags like v1.0.0

# Nothing by default; the release job asks for exactly what it needs.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write     # create the GitHub release
      id-token: write     # sign the build provenance attestation
      attestations: write # store the attestation
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    # Third-party actions are pinned to full commit SHAs so a moved tag cannot change them.
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0 # full history and tags, for the release notes

    - name: Set up Swift
      uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
      with:
        swift-version: '6'

    - name: Check tag matches app version
      run: |
        PLIST_VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" MissionStrike/Info.plist)
        if [ "v$PLIST_VERSION" != "$GITHUB_REF_NAME" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match Info.plist version $PLIST_VERSION"
          exit 1
        fi

    - name: Run tests
      run: |
        cd MissionStrike
        swift test

    - name: Build, sign and package
      env:
        MISSIONSTRIKE_P12_BASE64: ${{ secrets.MISSIONSTRIKE_P12_BASE64 }}
        MISSIONSTRIKE_P12_PASSWORD: ${{ secrets.MISSIONSTRIKE_P12_PASSWORD }}
        MISSIONSTRIKE_REQUIRE_SIGNING: '1'
      run: scripts/package-app.sh

    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: MissionStrike/dist/MissionStrike.app.zip

    # The in-app update window shows these notes. Changes land on main without pull
    # requests, so GitHub's generated notes would be empty; list the commit subjects instead.
    - name: Write release notes
      run: |
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
        {
          echo "## What's new"
          echo
          git log --no-merges --format='- %s' ${PREVIOUS_TAG:+"$PREVIOUS_TAG.."}"$GITHUB_REF_NAME" \
            | grep -v -E '^- (chore|docs)(\(.*\))?:' || true
          if [ -n "$PREVIOUS_TAG" ]; then
            echo
            echo "**Full Changelog**: [$PREVIOUS_TAG...$GITHUB_REF_NAME](https://github.com/$GITHUB_REPOSITORY/compare/$PREVIOUS_TAG...$GITHUB_REF_NAME)"
          fi
        } > release-notes.md
        cat release-notes.md

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" \
          MissionStrike/dist/MissionStrike.app.zip \
          MissionStrike/dist/MissionStrike.app.zip.sha256 \
          --title "$GITHUB_REF_NAME" \
          --notes-file release-notes.md \
          --verify-tag
